[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personify"
version = "0.1.0"
description = "Local-first personal data vault."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "sqlmodel>=0.0.16",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "tqdm>=4.66",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
]
embeddings = [
    "sentence-transformers>=2.5",
]

[project.scripts]
vault = "personify.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["personify"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
